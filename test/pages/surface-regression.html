<!doctype html>
<html><head><meta charset="utf-8"><title>Surface regression checks</title>
<style>body{margin:0;background:#172033;color:#e7edf8;font:14px system-ui}pre{white-space:pre-wrap;padding:16px;margin:0}canvas{display:block;width:100%;height:420px}</style></head>
<body><pre id="report">Loading surface regression checks…</pre><canvas id="canvas"></canvas>
<script type="module">
import * as THREE from "three";
import { SchematicRenderer } from "../../src/SchematicRenderer";
import { demoResourcePacks } from "./scripts/demo-packs";
const report = document.getElementById("report"), lines = [];
const mode = new URLSearchParams(location.search).get("mode") || "batched";
function check(value, label) { if (!value) throw new Error(label); lines.push("PASS " + label); report.textContent = `${mode}\n` + lines.join("\n"); }
const renderer = new SchematicRenderer(document.getElementById("canvas"), {
 gallery: async () => (await fetch("/schematics/glass-portals.litematic")).arrayBuffer()
}, demoResourcePacks, {
 meshBuildingMode: mode, enableAnimatedTextures: true, enableProgressBar: false,
 enableGizmos: false, showGrid: false, showAxes: false,
 callbacks: { onRendererInitialized: (r) => run(r).catch(e => { report.textContent += "\nFAIL " + e.stack; console.error(e); }) }
});
async function run(r) {
 const s = r.schematicManager.schematics.values().next().value;
 await s.getMeshes();
 const surfaceMeshes = () => s.group.children.filter(m => m.userData.surfaceMesh);
 const counts = () => surfaceMeshes().reduce((n,m) => n+(m.geometry.index?.count || m.geometry.getAttribute("position").count),0);
 const before = counts();
 check(before > 0, "Showcase surfaces loaded");
 const unrelated = s.group.children.filter(m => !m.userData.surfaceMesh);
 const distant = surfaceMeshes().filter(m => m.userData.surfaceSection === "2,0,2");
 await s.setBlock([1,2,2], "minecraft:blue_stained_glass");
 check(unrelated.every(m => m.parent === s.group), "Color edit preserves opaque meshes and signs");
 check(distant.every(m => m.parent === s.group), "Color edit preserves distant surface sections");
 await s.setBlock([1,2,2], "minecraft:white_stained_glass");
 check(counts() === before, "Color edit restores face counts");
 for (let i=0;i<3;i++) {
  await s.hideBlockAndRebuild(28,4,42);
  check(counts() === before - 6, "End portal hide removes exactly one cell " + (i+1));
  await s.unhideAllBlocks(); check(counts() === before, "Unhide restores surfaces without duplicates " + (i+1));
 }
 const material = surfaceMeshes().find(m => m.userData.animatedSurface).material;
 material.uniforms.uLayerClip.value.set(1,3);
 const camera = r.cameraManager.activeCamera.camera;
 camera.updateMatrixWorld();
 const frustum = new THREE.Frustum().setFromProjectionMatrix(new THREE.Matrix4().multiplyMatrices(camera.projectionMatrix,camera.matrixWorldInverse),camera.coordinateSystem);
 check(!s.hasSurfacesInView(frustum), "Layer-clipped End portal does not animate");
 material.uniforms.uLayerClip.value.set(0,1e9);
 const old = s.group.position.clone(); s.group.position.set(10000,10000,10000);
 check(!s.hasSurfacesInView(frustum), "Offscreen End portal does not animate");
 s.group.position.copy(old); s.group.updateMatrixWorld(true);
 s.opacity = 0; s.updateMeshMaterials("opacity"); r.renderManager.render();
 check(material.uniforms.uOpacity.value === 0, "End portal follows schematic opacity");
 s.opacity = 1; s.updateMeshMaterials("opacity"); r.renderManager.render();
 check(surfaceMeshes().filter(m=>m.name === "connected-glass-and-portals").every(m=>m.material.transparent), "Glass stays transparent after fading");
 await s.setBlock([1,2,2], "minecraft:stone");
 await s.setBlock([1,2,2], "minecraft:white_stained_glass");
 check(counts() === before, "Opaque transition rebuild restores all surfaces");
 r.renderManager.render();
 const errors = r.renderManager.renderer.info.programs?.filter(p => p.diagnostics?.runnable === false) || [];
 check(!errors.length, "All WebGL shaders compiled");
 report.textContent += "\nCOMPLETE";
}
</script></body></html>
